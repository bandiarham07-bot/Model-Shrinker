[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "model-shrinker"
version = "0.1.0"
description = "Make trained PyTorch MLPs and CNNs smaller and faster: pruning, quantization, and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "torchvision"]

[tool.setuptools.packages.find]
include = ["shrinker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
